name: Full ingest

on:
  # Fundamentals only change quarterly, so a monthly refresh is plenty to
  # keep the quality filter current without wasting Actions minutes; run it
  # manually any time via "Run workflow" for an immediate refresh (e.g.
  # right after first setting things up, before any daily data exists yet).
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  full-ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      # Refreshes the universe, full price history, and quarterly
      # fundamentals/estimates/earnings for every ticker (the "Daily run"
      # workflow deliberately skips the fundamentals statements — they only
      # change quarterly — so this is the only place that populates them).
      - name: Run full ingest
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python -m stock_tracker.ingest --full

      - name: Compute today's quality scores
        run: uv run python -m stock_tracker.quality

      - name: Commit updated database
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/tracker.db
          git diff --cached --quiet && echo "No database changes to commit" || git commit -m "Full ingest $(date -u +%Y-%m-%d)"
          git push

      - name: Upload database as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracker-db-full-${{ github.run_id }}
          path: data/tracker.db
          retention-days: 90

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-full-${{ github.run_id }}
          path: logs/
          retention-days: 30
