name: Debug yfinance market cap

# Throwaway diagnostic workflow — NOT part of the regular pipeline. Two
# consecutive attempts to fix YFinanceFundamentalsProvider._current_market_cap
# (fast_info accessor chain, then .info) both still produced NULL market_cap
# for every ticker in a real Full ingest run, with no visible exception in
# the logs either time. This runs against a single real ticker on GitHub's
# runner (same network as the real pipeline) so we can actually see what
# fast_info/.info return, instead of guessing a third blind fix. Delete this
# file once the real bug is found and fixed.

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Inspect yfinance fast_info / info for a few real tickers
        run: |
          uv run python -c "
          import yfinance as yf

          for symbol in ['AAPL', 'MSFT', 'ASML']:
              print('=' * 20, symbol, '=' * 20)
              t = yf.Ticker(symbol)

              print('--- fast_info ---')
              try:
                  fi = t.fast_info
                  print('type:', type(fi))
                  try:
                      print('keys:', list(fi.keys()))
                  except Exception as e:
                      print('no .keys():', repr(e))
                  try:
                      print('fi.market_cap attr:', fi.market_cap)
                  except Exception as e:
                      print('fi.market_cap attr EXC:', repr(e))
                  try:
                      print('fi[marketCap]:', fi['marketCap'])
                  except Exception as e:
                      print('fi[marketCap] EXC:', repr(e))
              except Exception as e:
                  print('fast_info access EXC:', repr(e))

              print('--- .info ---')
              try:
                  info = t.info
                  print('type:', type(info))
                  print('len:', len(info) if info else 0)
                  print('marketCap:', info.get('marketCap') if info else None)
                  if info:
                      sample_keys = list(info.keys())[:15]
                      print('sample keys:', sample_keys)
              except Exception as e:
                  print('.info access EXC:', repr(type(e).__name__), repr(e))

              print('--- get_info() ---')
              try:
                  gi = t.get_info()
                  print('get_info() marketCap:', gi.get('marketCap') if gi else None)
              except Exception as e:
                  print('get_info() EXC:', repr(type(e).__name__), repr(e))
          "
