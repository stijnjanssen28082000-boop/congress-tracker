[project]
name = "stock-tracker"
version = "0.1.0"
description = "Systematic dip-buy signal tracker for large-cap stocks (signals, backtests, dashboard — no order execution)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "yfinance>=0.2.40",
    "requests>=2.32",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "streamlit>=1.38",
    "certifi>=2024.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_tracker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
